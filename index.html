<!doctype html>
<html lang="ca">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVG Theme Editor</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header>
  <div id="drop" tabindex="0" role="button" aria-label="Importa un SVG: arrossega'l aquí, fes clic o enganxa'l amb Ctrl+V"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="i" aria-hidden="true"><path d="M4 11V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.706.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-1"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M2 15h10"/><path d="m9 18 3-3-3-3"/></svg><span id="fileName">Arrossega un SVG, fes clic per triar-lo o enganxa'l (Ctrl+V)</span></div>
  <input id="file" type="file" accept=".svg,image/svg+xml" hidden>
  <label class="samples">
    <span class="samples-k">Exemples</span>
    <select id="samples" aria-label="Carrega un exemple">
      <option value="">Tria un fitxer…</option>
      <option value="simple.svg">Simple</option>
      <option value="excalidraw-plot.svg">Gràfic Excalidraw</option>
      <option value="excalidraw-math.svg">Matemàtiques Excalidraw</option>
      <option value="tricky.svg">Casos difícils</option>
      <option value="themed.svg">Simple ja tematitzat</option>
    </select>
  </label>
</header>
<nav id="tabs" aria-label="Seccions">
  <button data-tab="0" aria-pressed="true">Editor</button><button data-tab="1" aria-pressed="false">Colors</button><button data-tab="2" aria-pressed="false">Resultat</button>
</nav>
<main data-tab="0">
  <section id="p-editor" aria-label="Editor SVG">
      <div class="bar">
        <div class="seg" role="group" aria-label="Vista de l'original"><button id="sCode" aria-pressed="false">Codi</button><button id="sImg" aria-pressed="true">Imatge</button></div>
        <div class="seg themeSeg" role="group" aria-label="Tema de la previsualització"><button data-t="light">☀ Clar</button><button data-t="dark">☾ Fosc</button></div>
        <span id="dirty" hidden>editat</span>
        <span id="msgSrc" role="status"></span>
        <button id="copySrc" class="icon" aria-label="Copia el codi de l'editor" title="Copia el codi de l'editor">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        </button>
        <button id="reparse" class="icon" aria-label="Reanalitza" title="Reanalitza (Ctrl+Enter)" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m12 16 4-4-4-4"/><path d="M8 12h8"/></svg>
        </button>
      </div>
    <div class="ed"><pre id="gutter" aria-hidden="true">1</pre><div class="code"><pre class="hl" aria-hidden="true"><code id="hlSrc"></code></pre><textarea id="src" spellcheck="false" wrap="off" aria-label="Codi SVG original"></textarea></div></div>
    <div id="prevSrc" class="prev" hidden><img id="imgSrc" alt="Previsualització de l'SVG original"></div>
    <div id="err" role="alert" hidden></div>
  </section>
  <section id="p-colors" aria-label="Gestor de colors">
    <div class="bar"><strong>Colors</strong><button id="invert">Invertir</button><button id="reset">Restaura</button></div>
    <ul id="list"></ul>
    <div id="warnWrap" hidden><button id="warnTgl" class="warn-t" type="button" aria-expanded="false" aria-controls="warns"><span id="warnIco" aria-hidden="true"></span>Avisos</button><ul id="warns" class="warn" hidden></ul></div>
  </section>
  <section id="p-out" aria-label="Resultat">
    <div class="bar">
      <div class="seg" role="group" aria-label="Vista"><button id="vCode" aria-pressed="true">Codi</button><button id="vImg" aria-pressed="false">Imatge</button></div>
      <div class="seg themeSeg" role="group" aria-label="Tema de la previsualització"><button data-t="light">☀ Clar</button><button data-t="dark">☾ Fosc</button></div>
      <div class="bar-end">
        <span id="msg" role="status"></span>
        <button id="copy" class="icon" disabled aria-label="Copia" title="Copia">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        </button>
        <button id="dl" class="icon" disabled aria-label="Descarrega" title="Descarrega">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        </button>
      </div>
    </div>
    <div class="code" id="outCode"><pre class="hl" aria-hidden="true"><code id="hlOut"></code></pre><textarea id="out" readonly spellcheck="false" wrap="off" aria-label="SVG generat"></textarea></div>
    <div id="prev" class="prev" hidden><img id="img" alt="Previsualització del SVG generat"></div>
  </section>
</main>
<script type="module" src="script.js"></script>
</body>
</html>
