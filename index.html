<!doctype html>
<html lang="ca">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVG Theme Converter</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header>
  <div id="drop" tabindex="0" role="button" aria-label="Importa un SVG: arrossega'l aquí, fes clic o enganxa'l amb Ctrl+V"><span aria-hidden="true">⇪</span><span id="fileName">Arrossega un SVG, fes clic per triar-lo o enganxa'l (Ctrl+V)</span></div>
  <input id="file" type="file" accept=".svg,image/svg+xml" hidden>
  <label class="samples">
    <span class="samples-k">Exemples</span>
    <select id="samples" aria-label="Carrega un exemple">
      <option value="">Tria un fitxer…</option>
      <option value="simple.svg">Simple</option>
      <option value="excalidraw-plot.svg">Gràfic Excalidraw</option>
      <option value="excalidraw-math.svg">Matemàtiques Excalidraw</option>
      <option value="tricky.svg">Casos difícils</option>
    </select>
  </label>
</header>
<nav id="tabs" aria-label="Seccions">
  <button data-tab="0" aria-pressed="true">Editor</button><button data-tab="1" aria-pressed="false">Colors</button><button data-tab="2" aria-pressed="false">Resultat</button>
</nav>
<main data-tab="0">
  <section id="p-editor" aria-label="Editor SVG">
      <div class="bar">
        <div class="seg" role="group" aria-label="Vista de l'original"><button id="sCode" aria-pressed="false">Codi</button><button id="sImg" aria-pressed="true">Imatge</button></div>
        <div class="seg themeSeg" role="group" aria-label="Tema de la previsualització" hidden><button data-t="light">☀ Clar</button><button data-t="dark">☾ Fosc</button></div>
        <span id="dirty" hidden>editat, sense analitzar</span><button id="reparse" title="Ctrl+Enter">Reanalitza</button>
      </div>
    <div class="ed"><pre id="gutter" aria-hidden="true">1</pre><textarea id="src" spellcheck="false" wrap="off" aria-label="Codi SVG original"></textarea></div>
    <div id="prevSrc" class="prev" hidden><img id="imgSrc" alt="Previsualització de l'SVG original"></div>
    <div id="err" role="alert" hidden></div>
  </section>
  <section id="p-colors" aria-label="Gestor de colors">
    <div class="bar"><strong>Colors</strong><button id="reset">Restaura suggerits</button></div>
    <ul id="list"></ul>
    <ul id="warns" class="warn" hidden></ul>
  </section>
  <section id="p-out" aria-label="Resultat">
    <div class="bar">
      <div class="seg" role="group" aria-label="Vista"><button id="vCode" aria-pressed="true">Codi</button><button id="vImg" aria-pressed="false">Imatge</button></div>
      <div class="seg themeSeg" role="group" aria-label="Tema de la previsualització" hidden><button data-t="light">☀ Clar</button><button data-t="dark">☾ Fosc</button></div>
      <button id="copy" disabled>Copia</button><button id="dl" disabled>Descarrega</button><span id="msg" role="status"></span>
    </div>
    <textarea id="out" readonly spellcheck="false" wrap="off" aria-label="SVG generat"></textarea>
    <div id="prev" class="prev" hidden><img id="img" alt="Previsualització del SVG generat"></div>
  </section>
</main>
<script type="module" src="script.js"></script>
</body>
</html>
