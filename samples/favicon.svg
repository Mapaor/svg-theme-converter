<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 100 100"
    width="200"
    height="200"
>
    <defs>
        <clipPath id="rounded-square">
            <rect width="100" height="100" rx="16" />
        </clipPath>
    </defs>

    <g clip-path="url(#rounded-square)">
        <rect width="100" height="100" fill="#fab619" />
        <path d="M 100,0 H 100 V 100 H 0 Z" fill="#801401" />
        <!--<path d="M 0,100 L 100,0" stroke="#FFFFFF" stroke-width="0" />-->
    </g>
</svg>
